packages:
  - apps/*
  - packages/*

# Dependencies explicitly allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  '@prisma/engines': true
  # Only prints a funding banner; not needed.
  core-js: false
  prisma: true

# Security fixes in transitive dependencies, each reviewed (docs/security-hardening.md, section 8).
overrides:
  # Pulled in by the Prisma CLI inside Neon Auth's adapter; EnvVault never loads it.
  mysql2: 3.24.5
  # Prisma's config loader (GHSA-ggr8-5vv4-36mx). Prisma 7.10.1 ships this same version.
  deepmerge-ts: 8.0.2
  # better-call (Neon Auth's Better Auth) resolved its zod peer to 4.5.4 (GHSA-mrhx-c7xc-m3w5,
  # memory exhaustion on oversized collections). Same major; EnvVault's own packages use 4.6.6.
  'zod@<4.6.6': 4.6.6
  # Advisories published 2026-10-22 to 2026-10-24, each fixed in the same major:
  # body-parser (Express, request bodies; GHSA-27r3-jxmh-p828, denial of service),
  # multer (pinned exactly by @nestjs/platform-express; GHSA-q7qp-rjg7-q26m),
  # undici (jsdom, tests only) and fast-uri (Nest CLI, build only).
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'multer@>=2.0.0 <2.5.0': 2.5.0
  'undici@>=8.0.0 <8.12.2': 8.12.2
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
