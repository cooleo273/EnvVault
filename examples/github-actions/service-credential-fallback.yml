# Fallback for runners without GitHub OIDC (for example some self hosted
# setups). Prefer OIDC: this credential is long lived and stored in GitHub,
# so anyone who can run a workflow with access to the secret can use it until
# it expires or is revoked. Give it the narrowest scopes and a short expiry,
# store it as an environment secret behind required reviewers, and rotate it.
name: build-with-credential
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - uses: actions/checkout@<full-commit-sha>
      - name: Build with EnvVault configuration
        uses: <owner>/<repo>/packages/github-action@<full-commit-sha>
        with:
          api-url: https://api.envvault.example.com
          environment: staging
          auth-mode: service-credential
          service-credential: ${{ secrets.ENVVAULT_SERVICE_CREDENTIAL }}
          command: npm run build
